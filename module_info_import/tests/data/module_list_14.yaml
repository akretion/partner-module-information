        \ id=\"configuration\">\n<h1><a class=\"toc-backref\" href=\"#toc-entry-1\"\
        >Configuration</a></h1>\n<p>Example:</p>\n<p>If you want to have an analytic\
        \ account on all your <em>expenses</em>,\nset the policy to <em>always</em>\
        \ for the account type <em>expense</em>.\nIf you try to save a journal items\
        \ with an account of type <em>expense</em>\nwithout analytic account, you\
        \ will get an error message.</p>\n<p>The analytic policy is company dependent.\
        \ If you have a multi-company\nenvironment, you should set its value for each\
        \ company.</p>\n</div>\n<div class=\"section\" id=\"bug-tracker\">\n<h1><a\
