        ul.auto-toc {\n  list-style-type: none }\n\n</style>\n</head>\n<body>\n<div\
        \ class=\"document\" id=\"base-customer-export\">\n<h1 class=\"title\">Base\
        \ Customer Export</h1>\n\n<!--
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! This file is generated by oca-gen-addon-readme !!\n!! changes will be
        overwritten.\
        \                   !!\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! source digest:
        sha256:fc0798a5bc3c1985ddc6ab0b42bbd059960a804486814de131b4075e7e0ee4c5\n\
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! -->\n<p><a
        class=\"reference\
        \ external image-reference\"
        href=\"https://odoo-community.org/page/development-status\"\
        ><img alt=\"Beta\"
        src=\"https://img.shields.io/badge/maturity-Beta-yellow.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"http://www.gnu.org/licenses/agpl-3.0-standalone.html\"\
        ><img alt=\"License: AGPL-3\"
        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://github.com/akretion/ak-odoo-incubator/tree/14.0/base_custom_export\"\
        ><img alt=\"akretion/ak-odoo-incubator\"
        src=\"https://img.shields.io/badge/github-akretion%2Fak--odoo--incubator-lightgray.png?logo=github\"\
        \ /></a></p>\n<p>This module allow easily export data into an attachment,\
        \ using Odoo native exporting tool.\nIts meant to be used by submodules needing\
        \ to export data and add the following features :\n- Easily re-order the fields\
        \ to export (actually comes from base_export_manager module)\n- Allow to
        customize\
        \ the fields label to have a fully customizable header\n- Allow to customize\
        \ the filename\n- Allow to add more data (not from fields), this module
        implement\
        \ the possibility to add static data\nbut it can easily be extended to add\
        \ more complex logic to get some advanced custom data</p>\n<p>It supports\
        \ csv and xlsx format but other one could easily be added</p>\n<p><strong>Table\
        \ of contents</strong></p>\n<div class=\"contents local topic\" id=\"contents\"\
        >\n<ul class=\"simple\">\n<li><a class=\"reference internal\"
        href=\"#known-issues-roadmap\"\
        \ id=\"toc-entry-1\">Known issues / Roadmap</a></li>\n<li><a class=\"reference\
        \ internal\" href=\"#bug-tracker\" id=\"toc-entry-2\">Bug Tracker</a></li>\n\
        <li><a class=\"reference internal\" href=\"#credits\"
        id=\"toc-entry-3\">Credits</a><ul>\n\
        <li><a class=\"reference internal\" href=\"#authors\"
        id=\"toc-entry-4\">Authors</a></li>\n\
        <li><a class=\"reference internal\" href=\"#maintainers\" id=\"toc-entry-5\"\
        >Maintainers</a></li>\n</ul>\n</li>\n</ul>\n</div>\n<div class=\"section\"\
        \ id=\"known-issues-roadmap\">\n<h1><a class=\"toc-backref\"
        href=\"#toc-entry-1\"\
        >Known issues / Roadmap</a></h1>\n<p>I believe this module could be refactored\
        \ a bit along with pattern_import_export, to become a dependency of
        pattern_import_export.\
        \ (<a class=\"reference external\"
        href=\"https://github.com/akretion/pattern-import-export/\"\
        >https://github.com/akretion/pattern-import-export/</a>)\nIncluding the missing\
        \ feature (customizable field name and file name) and possibility to add more\
        \ info in export (static value\u2026) could be done directly in
        pattern_import_export,\
        \ but it is a big module with a lot of features to install for this small\
        \ need.\nActually all the helpers to get configurable data from export may\
        \ or not be usefull for other formats. If you want to implement a very specific\
        \ xml for instance (to be used with purchase_edi) you may want to by pass\
        \ all that. That is why export field and additional data fields are invisible\
        \ in case file_format is not csv and xls.\nIn case of a new format
        implementation,\
        \ one should manage if this is export tools is usefull or not.</p>\n</div>\n\
        <div class=\"section\" id=\"bug-tracker\">\n<h1><a class=\"toc-backref\"
        href=\"\
        #toc-entry-2\">Bug Tracker</a></h1>\n<p>Bugs are tracked on <a
        class=\"reference\
        \ external\" href=\"https://github.com/akretion/ak-odoo-incubator/issues\"\
        >GitHub Issues</a>.\nIn case of trouble, please check there if your issue\
        \ has already been reported.\nIf you spotted it first, help us to smash it\
        \ by providing a detailed and welcomed\n<a class=\"reference external\" href=\"\
        https://github.com/akretion/ak-odoo-incubator/issues/new?body=module:%20base_custom_export%0Aversion:%2014.0%0A%0A**Steps%20to%20reproduce**%0A-%20...%0A%0A**Current%20behavior**%0A%0A**Expected%20behavior**\"\
        >feedback</a>.</p>\n<p>Do not contact contributors directly about support\
        \ or help with technical issues.</p>\n</div>\n<div class=\"section\" id=\"\
        credits\">\n<h1><a class=\"toc-backref\"
        href=\"#toc-entry-3\">Credits</a></h1>\n\
        <div class=\"section\" id=\"authors\">\n<h2><a class=\"toc-backref\" href=\"\
        #toc-entry-4\">Authors</a></h2>\n<ul class=\"simple\">\n<li>Akretion</li>\n\
        </ul>\n</div>\n<div class=\"section\" id=\"maintainers\">\n<h2><a class=\"\
        toc-backref\" href=\"#toc-entry-5\">Maintainers</a></h2>\n<p>This module is\
        \ part of the <a class=\"reference external\"
        href=\"https://github.com/akretion/ak-odoo-incubator/tree/14.0/base_custom_export\"\
        >akretion/ak-odoo-incubator</a> project on GitHub.</p>\n<p>You are welcome\
        \ to contribute.</p>\n</div>\n</div>\n</div>\n</body>\n</html>\n"
