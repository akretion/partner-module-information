        id=\"toc-entry-6\">Authors</a></li>\n\
        <li><a class=\"reference internal\" href=\"#contributors\" id=\"toc-entry-7\"\
        >Contributors</a></li>\n<li><a class=\"reference internal\"
        href=\"#maintainers\"\
        \ id=\"toc-entry-8\">Maintainers</a></li>\n</ul>\n</li>\n</ul>\n</div>\n<div\
        \ class=\"section\" id=\"configuration\">\n<h1><a class=\"toc-backref\" href=\"\
        #toc-entry-1\">Configuration</a></h1>\n<p>By default, it calls pywebdriver\
        \ on \u201C<a class=\"reference external\"
        href=\"https://localhost\">https://localhost</a>\u201D\
        .</p>\n</div>\n<div class=\"section\" id=\"usage\">\n<h1><a
        class=\"toc-backref\"\
        \ href=\"#toc-entry-2\">Usage</a></h1>\n<p>Use given methods to format proxy\
        \ actions and execute them.</p>\n</div>\n<div class=\"section\"
