        \ class=\"document\" id=\"database-age-cron\">\n<h1 class=\"title\">Database\
        \ Age Cron</h1>\n\n<!-- !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! This file is generated by oca-gen-addon-readme !!\n!! changes will be
        overwritten.\
        \                   !!\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! source digest:
        sha256:33d370f2b353bc5c264e4dccaf6c43e38fa83eacf59bb47be854c22596d00956\n\
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! -->\n<p><a
        class=\"reference\
        \ external image-reference\"
        href=\"https://odoo-community.org/page/development-status\"\
        ><img alt=\"Beta\"
        src=\"https://img.shields.io/badge/maturity-Beta-yellow.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"http://www.gnu.org/licenses/agpl-3.0-standalone.html\"\
        ><img alt=\"License: AGPL-3\"
        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://github.com/akretion/ak-odoo-incubator/tree/14.0/database_age_cron\"\
        ><img alt=\"akretion/ak-odoo-incubator\"
        src=\"https://img.shields.io/badge/github-akretion%2Fak--odoo--incubator-lightgray.png?logo=github\"\
        \ /></a></p>\n<p>This module adds a simple cron that allows to know easily\
        \ what is the age of the database</p>\n<p>You just have to check the
        <cite>lastcall</cite>\
        \ date of the cron (via Odoo or via SQL)\nto know when it ran for the last\
        \ time.</p>\n<p><strong>Table of contents</strong></p>\n<div class=\"contents\
        \ local topic\" id=\"contents\">\n<ul class=\"simple\">\n<li><a
        class=\"reference\
        \ internal\" href=\"#usage\" id=\"toc-entry-1\">Usage</a></li>\n<li><a class=\"\
        reference internal\" href=\"#bug-tracker\" id=\"toc-entry-2\">Bug
        Tracker</a></li>\n\
        <li><a class=\"reference internal\" href=\"#credits\"
        id=\"toc-entry-3\">Credits</a><ul>\n\
        <li><a class=\"reference internal\" href=\"#authors\"
        id=\"toc-entry-4\">Authors</a></li>\n\
        <li><a class=\"reference internal\" href=\"#maintainers\" id=\"toc-entry-5\"\
        >Maintainers</a></li>\n</ul>\n</li>\n</ul>\n</div>\n<div class=\"section\"\
        \ id=\"usage\">\n<h1><a class=\"toc-backref\"
        href=\"#toc-entry-1\">Usage</a></h1>\n\
        <p>To make it work, you will need to deactivate the cron once the database\
        \ is not in production anymore.</p>\n<p>For instance with a script that
        runs:</p>\n\
        <pre class=\"code sql literal-block\">\n<span class=\"k\">UPDATE</span><span\
        \ class=\"w\"> </span><span class=\"n\">ir_cron</span><span class=\"w\">
        </span><span\
        \ class=\"k\">SET</span><span class=\"w\"> </span><span
        class=\"n\">active</span><span\
        \ class=\"o\">=</span><span class=\"s1\">'f'</span><span class=\"w\">
        </span><span\
        \ class=\"k\">WHERE</span><span class=\"w\"> </span><span
        class=\"n\">cron_name</span><span\
        \ class=\"w\"> </span><span class=\"o\">=</span><span class=\"w\"> </span><span\
        \ class=\"s1\">'Database Age Cron'</span><span class=\"p\">;</span>\n</pre>\n\
        </div>\n<div class=\"section\" id=\"bug-tracker\">\n<h1><a
        class=\"toc-backref\"\
        \ href=\"#toc-entry-2\">Bug Tracker</a></h1>\n<p>Bugs are tracked on <a
        class=\"\
        reference external\"
        href=\"https://github.com/akretion/ak-odoo-incubator/issues\"\
        >GitHub Issues</a>.\nIn case of trouble, please check there if your issue\
        \ has already been reported.\nIf you spotted it first, help us to smash it\
        \ by providing a detailed and welcomed\n<a class=\"reference external\" href=\"\
        https://github.com/akretion/ak-odoo-incubator/issues/new?body=module:%20database_age_cron%0Aversion:%2014.0%0A%0A**Steps%20to%20reproduce**%0A-%20...%0A%0A**Current%20behavior**%0A%0A**Expected%20behavior**\"\
        >feedback</a>.</p>\n<p>Do not contact contributors directly about support\
        \ or help with technical issues.</p>\n</div>\n<div class=\"section\" id=\"\
        credits\">\n<h1><a class=\"toc-backref\"
        href=\"#toc-entry-3\">Credits</a></h1>\n\
        <div class=\"section\" id=\"authors\">\n<h2><a class=\"toc-backref\" href=\"\
        #toc-entry-4\">Authors</a></h2>\n<ul class=\"simple\">\n<li>Akretion</li>\n\
        </ul>\n</div>\n<div class=\"section\" id=\"maintainers\">\n<h2><a class=\"\
        toc-backref\" href=\"#toc-entry-5\">Maintainers</a></h2>\n<p>This module is\
        \ part of the <a class=\"reference external\"
        href=\"https://github.com/akretion/ak-odoo-incubator/tree/14.0/database_age_cron\"\
        >akretion/ak-odoo-incubator</a> project on GitHub.</p>\n<p>You are welcome\
        \ to contribute.</p>\n</div>\n</div>\n</div>\n</body>\n</html>\n"
