        class=\"reference\
        \ internal\" href=\"#contributors\" id=\"toc-entry-6\">Contributors</a></li>\n\
        <li><a class=\"reference internal\" href=\"#maintainers\" id=\"toc-entry-7\"\
        >Maintainers</a></li>\n</ul>\n</li>\n</ul>\n</div>\n<div class=\"section\"\
        \ id=\"installation\">\n<h1><a class=\"toc-backref\" href=\"#toc-entry-1\"\
        >Installation</a></h1>\n<p>This module is auto-installed by Odoo when
        <em>analytic_partner</em>\
        \ and\n<em>hr_timesheet</em> are installed.</p>\n</div>\n<div class=\"section\"\
        \ id=\"usage\">\n<h1><a class=\"toc-backref\"
        href=\"#toc-entry-2\">Usage</a></h1>\n\
        <p>Go to Timesheets &gt; My Timesheet &gt; Detailed Activities, and you will\
        \ find there\nthe partner field. You can set it, search for it or group by\
        \ it.</p>\n<p>You can also go to a partner, and click on the smart-button\
        \ \u201CActivities\u201D to\nsee, edit or add the related timesheet
        activities.</p>\n\
        </div>\n<div class=\"section\" id=\"bug-tracker\">\n<h1><a
        class=\"toc-backref\"\
        \ href=\"#toc-entry-3\">Bug Tracker</a></h1>\n<p>Bugs are tracked on <a
        class=\"\
        reference external\" href=\"https://github.com/OCA/account-analytic/issues\"\
        >GitHub Issues</a>.\nIn case of trouble, please check there if your issue\
