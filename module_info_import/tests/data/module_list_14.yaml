        \ class=\"document\" id=\"link-analytic-items-and-partner\">\n<h1 class=\"\
        title\">Link analytic items and partner</h1>\n\n<!--
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! This file is generated by oca-gen-addon-readme !!\n!! changes will be
        overwritten.\
        \                   !!\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! source digest:
        sha256:17d656ca7748848bc209ec4d4b809a6766c04527d3bf8f2db659f0a768db1d6b\n\
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! -->\n<p><a
        class=\"reference\
        \ external image-reference\"
        href=\"https://odoo-community.org/page/development-status\"\
        ><img alt=\"Beta\"
        src=\"https://img.shields.io/badge/maturity-Beta-yellow.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"http://www.gnu.org/licenses/agpl-3.0-standalone.html\"\
        ><img alt=\"License: AGPL-3\"
        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://github.com/OCA/account-analytic/tree/14.0/analytic_partner\"\
        ><img alt=\"OCA/account-analytic\"
        src=\"https://img.shields.io/badge/github-OCA%2Faccount--analytic-lightgray.png?logo=github\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://translation.odoo-community.org/projects/account-analytic-14-0/account-analytic-14-0-analytic_partner\"\
        ><img alt=\"Translate me on Weblate\"
        src=\"https://img.shields.io/badge/weblate-Translate%20me-F47D42.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://runboat.odoo-community.org/builds?repo=OCA/account-analytic&amp;target_branch=14.0\"\
        ><img alt=\"Try me on Runboat\"
        src=\"https://img.shields.io/badge/runboat-Try%20me-875A7B.png\"\
        \ /></a></p>\n<p>This module adds a commercial partner on each analytic item\
        \ for allowing to\nhave another dimension for data analysis.</p>\n<p>It also\
        \ handles the proper propagation of this field to the created analytic\nentries\
        \ when validating invoices.</p>\n<p><strong>Table of contents</strong></p>\n\
        <div class=\"contents local topic\" id=\"contents\">\n<ul class=\"simple\"\
        >\n<li><a class=\"reference internal\" href=\"#configuration\"
        id=\"toc-entry-1\"\
        >Configuration</a></li>\n<li><a class=\"reference internal\" href=\"#usage\"\
        \ id=\"toc-entry-2\">Usage</a></li>\n<li><a class=\"reference internal\"
        href=\"\
        #known-issues-roadmap\" id=\"toc-entry-3\">Known issues / Roadmap</a></li>\n\
        <li><a class=\"reference internal\" href=\"#changelog\" id=\"toc-entry-4\"\
        >Changelog</a><ul>\n<li><a class=\"reference internal\" href=\"#section-1\"\
        \ id=\"toc-entry-5\">13.0.1.0.0 (2020-01-07)</a></li>\n<li><a class=\"reference\
        \ internal\" href=\"#section-2\" id=\"toc-entry-6\">12.0.1.0.0
        (2019-01-17)</a></li>\n\
        <li><a class=\"reference internal\" href=\"#section-3\" id=\"toc-entry-7\"\
        >11.0.1.0.0 (2018-10-15)</a></li>\n<li><a class=\"reference internal\" href=\"\
        #section-4\" id=\"toc-entry-8\">10.0.1.0.0 (2017-05-22)</a></li>\n<li><a
        class=\"\
        reference internal\" href=\"#section-5\" id=\"toc-entry-9\">8.0.1.0.1
        (2015-08-20)</a></li>\n\
        <li><a class=\"reference internal\" href=\"#section-6\" id=\"toc-entry-10\"\
        >8.0.1.0.0 (2015-08-13)</a></li>\n</ul>\n</li>\n<li><a class=\"reference
        internal\"\
        \ href=\"#bug-tracker\" id=\"toc-entry-11\">Bug Tracker</a></li>\n<li><a
        class=\"\
        reference internal\" href=\"#credits\" id=\"toc-entry-12\">Credits</a><ul>\n\
        <li><a class=\"reference internal\" href=\"#authors\" id=\"toc-entry-13\"\
        >Authors</a></li>\n<li><a class=\"reference internal\" href=\"#contributors\"\
        \ id=\"toc-entry-14\">Contributors</a></li>\n<li><a class=\"reference
        internal\"\
        \ href=\"#maintainers\" id=\"toc-entry-15\">Maintainers</a></li>\n</ul>\n\
        </li>\n</ul>\n</div>\n<div class=\"section\" id=\"configuration\">\n<h1><a\
        \ class=\"toc-backref\" href=\"#toc-entry-1\">Configuration</a></h1>\n<p>To\
        \ configure this module, you need to:</p>\n<ol class=\"arabic simple\">\n\
        <li>Go to <strong>Setting &gt; Users &gt; Users</strong> and check you have\
        \ as at least \u201CAdviser\u201D\nin your user profile and have checked the\
        \ \u201CShow Full Accounting Features\u201D and\n\u201CAnalytic
        Accounting\u201D\
        \ access rights.</li>\n</ol>\n</div>\n<div class=\"section\" id=\"usage\"\
        >\n<h1><a class=\"toc-backref\" href=\"#toc-entry-2\">Usage</a></h1>\n<ol\
        \ class=\"arabic simple\">\n<li>Go to <strong>Invoicing &gt; Configuration\
        \ &gt; Management &gt; Analytic Items</strong>.</li>\n<li>Set the <strong>other\
        \ partner</strong> in the form view of an the analytic entry.</li>\n<li>Go\
        \ back to list view where you can search and group by this new field.</li>\n\
        </ol>\n<p>You can also:</p>\n<ol class=\"arabic simple\">\n<li>Go to the form\
        \ view of one of the partners selected as \u201Cother partner\u201D.</li>\n\
        <li>Click on the smart-button <strong>Cost/Revenue</strong> placed on the\
        \ upper-right part.</li>\n<li>Navigate to the analytic items associated to\
        \ this partner.</li>\n</ol>\n</div>\n<div class=\"section\"
        id=\"known-issues-roadmap\"\
        >\n<h1><a class=\"toc-backref\" href=\"#toc-entry-3\">Known issues /
        Roadmap</a></h1>\n\
        <p>This module hasn\u2019t been tested with
        <em>account_analytic_distribution</em>\
        \ module\ninstalled, so maybe it\u2019s incompatible with it.</p>\n</div>\n\
        <div class=\"section\" id=\"changelog\">\n<h1><a class=\"toc-backref\" href=\"\
        #toc-entry-4\">Changelog</a></h1>\n<div class=\"section\" id=\"section-1\"\
        >\n<h2><a class=\"toc-backref\" href=\"#toc-entry-5\">13.0.1.0.0
        (2020-01-07)</a></h2>\n\
        <p>Migrated to odoo 13.</p>\n</div>\n<div class=\"section\" id=\"section-2\"\
        >\n<h2><a class=\"toc-backref\" href=\"#toc-entry-6\">12.0.1.0.0
        (2019-01-17)</a></h2>\n\
        <p>Migrated to odoo 12.</p>\n</div>\n<div class=\"section\" id=\"section-3\"\
        >\n<h2><a class=\"toc-backref\" href=\"#toc-entry-7\">11.0.1.0.0
        (2018-10-15)</a></h2>\n\
        <p>Migrated to odoo 11.</p>\n</div>\n<div class=\"section\" id=\"section-4\"\
        >\n<h2><a class=\"toc-backref\" href=\"#toc-entry-8\">10.0.1.0.0
        (2017-05-22)</a></h2>\n\
        <p>Migrated to odoo 10.</p>\n</div>\n<div class=\"section\" id=\"section-5\"\
        >\n<h2><a class=\"toc-backref\" href=\"#toc-entry-9\">8.0.1.0.1
        (2015-08-20)</a></h2>\n\
        <ul class=\"simple\">\n<li>[IMP] Distinguish between the partner of the account\
        \ and the specific partner.</li>\n<li>[FIX] Allow grouping on partner_id
        field.</li>\n\
        <li>[FIX] README - Indentation is not correct in Known issues.</li>\n</ul>\n\
        </div>\n<div class=\"section\" id=\"section-6\">\n<h2><a class=\"toc-backref\"\
        \ href=\"#toc-entry-10\">8.0.1.0.0 (2015-08-13)</a></h2>\n<p>First
        version.</p>\n\
        </div>\n</div>\n<div class=\"section\" id=\"bug-tracker\">\n<h1><a class=\"\
        toc-backref\" href=\"#toc-entry-11\">Bug Tracker</a></h1>\n<p>Bugs are tracked\
        \ on <a class=\"reference external\"
        href=\"https://github.com/OCA/account-analytic/issues\"\
        >GitHub Issues</a>.\nIn case of trouble, please check there if your issue\
        \ has already been reported.\nIf you spotted it first, help us to smash it\
        \ by providing a detailed and welcomed\n<a class=\"reference external\" href=\"\
        https://github.com/OCA/account-analytic/issues/new?body=module:%20analytic_partner%0Aversion:%2014.0%0A%0A**Steps%20to%20reproduce**%0A-%20...%0A%0A**Current%20behavior**%0A%0A**Expected%20behavior**\"\
        >feedback</a>.</p>\n<p>Do not contact contributors directly about support\
        \ or help with technical issues.</p>\n</div>\n<div class=\"section\" id=\"\
        credits\">\n<h1><a class=\"toc-backref\"
        href=\"#toc-entry-12\">Credits</a></h1>\n\
        <div class=\"section\" id=\"authors\">\n<h2><a class=\"toc-backref\" href=\"\
        #toc-entry-13\">Authors</a></h2>\n<ul class=\"simple\">\n<li>Tecnativa</li>\n\
        </ul>\n</div>\n<div class=\"section\" id=\"contributors\">\n<h2><a class=\"\
        toc-backref\" href=\"#toc-entry-14\">Contributors</a></h2>\n<ul
        class=\"simple\"\
        >\n<li><a class=\"reference external\" href=\"https://www.tecnativa.com\"\
        >Tecnativa</a>:<ul>\n<li>Pedro M. Baeza</li>\n<li>Luis M.
        Ontalba</li>\n<li>Cristina\
        \ Martin R.</li>\n<li>Sergio Teruel</li>\n<li>Carlos Roca</li>\n</ul>\n</li>\n\
        <li><a class=\"reference external\"
        href=\"https://ecosoft.co.th/\">Ecosoft</a>:<ul>\n\
        <li>Pimolnat Suntian &lt;<a class=\"reference external\"
        href=\"mailto:pimolnats&#64;ecosoft.co.th\"\
        >pimolnats&#64;ecosoft.co.th</a>&gt;</li>\n</ul>\n</li>\n</ul>\n</div>\n<div\
        \ class=\"section\" id=\"maintainers\">\n<h2><a class=\"toc-backref\" href=\"\
        #toc-entry-15\">Maintainers</a></h2>\n<p>This module is maintained by the\
        \ OCA.</p>\n<a class=\"reference external image-reference\"
        href=\"https://odoo-community.org\"\
        ><img alt=\"Odoo Community Association\"
        src=\"https://odoo-community.org/logo.png\"\
        \ /></a>\n<p>OCA, or the Odoo Community Association, is a nonprofit
        organization\
        \ whose\nmission is to support the collaborative development of Odoo features\
        \ and\npromote its widespread use.</p>\n<p>This module is part of the <a
        class=\"\
        reference external\"
        href=\"https://github.com/OCA/account-analytic/tree/14.0/analytic_partner\"\
        >OCA/account-analytic</a> project on GitHub.</p>\n<p>You are welcome to
        contribute.\
        \ To learn how please visit <a class=\"reference external\"
