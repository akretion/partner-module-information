        ><img alt=\"Try me on Runbot\"
        src=\"https://img.shields.io/badge/runbot-Try%20me-875A7B.png\"\
        \ /></a></p>\n<p>This module extends the functionality of
        account_mass_reconcile\
        \ and\nallow an user to reconcile debits and credits of an Account\nusing\
        \ the RMA Line as key field. This type of\nreconciliation is to be used in\
        \ the context of the Perpetual Inventory\naccounting system, with the accrual\
        \ account \u2018<em>Goods Received Not
        Invoiced</em>\u2019.</p>\n<p><strong>Table\
        \ of contents</strong></p>\n<div class=\"contents local topic\" id=\"contents\"\
        >\n<ul class=\"simple\">\n<li><a class=\"reference internal\" href=\"#usage\"\
        \ id=\"id1\">Usage</a></li>\n<li><a class=\"reference internal\"
        href=\"#bug-tracker\"\
        \ id=\"id2\">Bug Tracker</a></li>\n<li><a class=\"reference internal\" href=\"\
        #credits\" id=\"id3\">Credits</a><ul>\n<li><a class=\"reference internal\"\
        \ href=\"#authors\" id=\"id4\">Authors</a></li>\n<li><a class=\"reference\
        \ internal\" href=\"#contributors\" id=\"id5\">Contributors</a></li>\n<li><a\
        \ class=\"reference internal\" href=\"#maintainers\"
        id=\"id6\">Maintainers</a></li>\n\
        </ul>\n</li>\n</ul>\n</div>\n<div class=\"section\" id=\"usage\">\n<h1><a\
        \ class=\"toc-backref\" href=\"#id1\">Usage</a></h1>\n<p>To use this module,\
        \ you need to:</p>\n<ul class=\"simple\">\n<li>Go to \u2018Invoicing /
        Accounting\
        \ / Actions / Mass Automatic Reconcile\u2019.</li>\n<li>Create a new
        reconciliation\
        \ profile, and select a new configuration entry\nwith type \u2018Advanced.\
        \ RMA Order line\u2019.</li>\n</ul>\n</div>\n<div class=\"section\" id=\"\
        bug-tracker\">\n<h1><a class=\"toc-backref\" href=\"#id2\">Bug
        Tracker</a></h1>\n\
        <p>Bugs are tracked on <a class=\"reference external\"
        href=\"https://github.com/OCA/rma/issues\"\
        >GitHub Issues</a>.\nIn case of trouble, please check there if your issue\
