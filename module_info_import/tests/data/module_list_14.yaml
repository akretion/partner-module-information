        \ /></a></p>\n<p>Small usability improvements on MRP:</p>\n<ul class=\"simple\"\
        >\n<li>order by id desc</li>\n<li>show field date_start and date_finished\
        \ on mrp.production form view</li>\n<li>show more fields on stock move
