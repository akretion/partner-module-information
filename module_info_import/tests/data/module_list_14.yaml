        ><img alt=\"bealdav\" src=\"https://github.com/bealdav.png?size=40px\" /></a>\
        \ <a class=\"reference external image-reference\"
        href=\"https://github.com/PierrickBrun\"\
        ><img alt=\"PierrickBrun\"
        src=\"https://github.com/PierrickBrun.png?size=40px\"\
