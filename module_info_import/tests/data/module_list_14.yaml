        </div>\n<div class=\"section\" id=\"contributors\">\n<h2><a
        class=\"toc-backref\"\
        \ href=\"#id4\">Contributors</a></h2>\n<ul class=\"simple\">\n<li>Alexis de\
        \ Lattre &lt;<a class=\"reference external\"
        href=\"mailto:alexis.delattre&#64;akretion.com\"\
        >alexis.delattre&#64;akretion.com</a>&gt;</li>\n<li>David Beal &lt;<a class=\"\
        reference external\"
        href=\"mailto:david.beal&#64;akretion.com\">david.beal&#64;akretion.com</a>&gt;</li>\n\
        </ul>\n</div>\n<div class=\"section\" id=\"maintainers\">\n<h2><a class=\"\
        toc-backref\" href=\"#id5\">Maintainers</a></h2>\n<p>This module is part of\
        \ the <a class=\"reference external\"
        href=\"https://github.com/akretion/odoo-usability/tree/12.0/base_usability\"\
        >akretion/odoo-usability</a> project on GitHub.</p>\n<p>You are welcome to\
