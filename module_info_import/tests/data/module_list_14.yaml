        \ class=\"document\" id=\"account-analytic-no-lines\">\n<h1 class=\"title\"\
        >Account Analytic No Lines</h1>\n\n<!--
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! This file is generated by oca-gen-addon-readme !!\n!! changes will be
        overwritten.\
        \                   !!\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! source digest:
        sha256:73efa74eb64f359e90f0fc1a62419aa56033e91796fa1c0e315cc08ddfe74f77\n\
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! -->\n<p><a
        class=\"reference\
        \ external image-reference\"
        href=\"https://odoo-community.org/page/development-status\"\
        ><img alt=\"Beta\"
        src=\"https://img.shields.io/badge/maturity-Beta-yellow.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"http://www.gnu.org/licenses/agpl-3.0-standalone.html\"\
        ><img alt=\"License: AGPL-3\"
        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://github.com/OCA/account-analytic/tree/14.0/account_analytic_no_lines\"\
        ><img alt=\"OCA/account-analytic\"
        src=\"https://img.shields.io/badge/github-OCA%2Faccount--analytic-lightgray.png?logo=github\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://translation.odoo-community.org/projects/account-analytic-14-0/account-analytic-14-0-account_analytic_no_lines\"\
        ><img alt=\"Translate me on Weblate\"
        src=\"https://img.shields.io/badge/weblate-Translate%20me-F47D42.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://runboat.odoo-community.org/builds?repo=OCA/account-analytic&amp;target_branch=14.0\"\
        ><img alt=\"Try me on Runboat\"
        src=\"https://img.shields.io/badge/runboat-Try%20me-875A7B.png\"\
        \ /></a></p>\n<p>This module hides analytics lines from accounting menus and\
        \ disable their generation from a move line.</p>\n<p>In many situations (i.e.\
        \ when there are no analytic distribution, and when people don\u2019t consider\
        \ timesheets as analytic entries),\nthe generation of analytic entries for\
        \ each account move is redundant, creates overhead and poses a risk of
        desynchronization\
        \ between analytic data and GL entries.\nIn such situations, users are happy\
        \ to do their analytics reporting on account move lines and don\u2019t need\
        \ analytic entries.\nThis module disables the generation of analytic entries\
        \ and related menus.</p>\n<p><strong>Table of contents</strong></p>\n<div\
        \ class=\"contents local topic\" id=\"contents\">\n<ul class=\"simple\">\n\
        <li><a class=\"reference internal\" href=\"#bug-tracker\" id=\"toc-entry-1\"\
        >Bug Tracker</a></li>\n<li><a class=\"reference internal\" href=\"#credits\"\
        \ id=\"toc-entry-2\">Credits</a><ul>\n<li><a class=\"reference internal\"\
        \ href=\"#authors\" id=\"toc-entry-3\">Authors</a></li>\n<li><a
        class=\"reference\
        \ internal\" href=\"#contributors\" id=\"toc-entry-4\">Contributors</a></li>\n\
        <li><a class=\"reference internal\" href=\"#maintainers\" id=\"toc-entry-5\"\
        >Maintainers</a></li>\n</ul>\n</li>\n</ul>\n</div>\n<div class=\"section\"\
        \ id=\"bug-tracker\">\n<h1><a class=\"toc-backref\" href=\"#toc-entry-1\"\
        >Bug Tracker</a></h1>\n<p>Bugs are tracked on <a class=\"reference external\"\
        \ href=\"https://github.com/OCA/account-analytic/issues\">GitHub Issues</a>.\n\
        In case of trouble, please check there if your issue has already been
        reported.\n\
        If you spotted it first, help us to smash it by providing a detailed and
        welcomed\n\
        <a class=\"reference external\"
        href=\"https://github.com/OCA/account-analytic/issues/new?body=module:%20account_analytic_no_lines%0Aversion:%2014.0%0A%0A**Steps%20to%20reproduce**%0A-%20...%0A%0A**Current%20behavior**%0A%0A**Expected%20behavior**\"\
        >feedback</a>.</p>\n<p>Do not contact contributors directly about support\
        \ or help with technical issues.</p>\n</div>\n<div class=\"section\" id=\"\
        credits\">\n<h1><a class=\"toc-backref\"
        href=\"#toc-entry-2\">Credits</a></h1>\n\
        <div class=\"section\" id=\"authors\">\n<h2><a class=\"toc-backref\" href=\"\
        #toc-entry-3\">Authors</a></h2>\n<ul class=\"simple\">\n<li>ACSONE SA/NV</li>\n\
        <li>Akretion</li>\n</ul>\n</div>\n<div class=\"section\" id=\"contributors\"\
        >\n<h2><a class=\"toc-backref\" href=\"#toc-entry-4\">Contributors</a></h2>\n\
        <ul class=\"simple\">\n<li>Thomas Binsfeld &lt;<a class=\"reference external\"\
        \
        href=\"mailto:thomas.binsfeld&#64;acsone.eu\">thomas.binsfeld&#64;acsone.eu</a>&gt;</li>\n\
        <li>Alexis de Lattre &lt;<a class=\"reference external\"
        href=\"mailto:alexis.delattre&#64;akretion.com\"\
        >alexis.delattre&#64;akretion.com</a>&gt;</li>\n</ul>\n</div>\n<div class=\"\
        section\" id=\"maintainers\">\n<h2><a class=\"toc-backref\"
        href=\"#toc-entry-5\"\
        >Maintainers</a></h2>\n<p>This module is maintained by the OCA.</p>\n<a
        class=\"\
        reference external image-reference\" href=\"https://odoo-community.org\"><img\
        \ alt=\"Odoo Community Association\"
        src=\"https://odoo-community.org/logo.png\"\
        \ /></a>\n<p>OCA, or the Odoo Community Association, is a nonprofit
        organization\
        \ whose\nmission is to support the collaborative development of Odoo features\
        \ and\npromote its widespread use.</p>\n<p>This module is part of the <a
