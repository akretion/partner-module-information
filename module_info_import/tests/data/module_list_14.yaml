        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! -->\n<p><a
        class=\"reference\
        \ external image-reference\"
        href=\"https://odoo-community.org/page/development-status\"\
        ><img alt=\"Beta\"
        src=\"https://img.shields.io/badge/maturity-Beta-yellow.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"http://www.gnu.org/licenses/agpl-3.0-standalone.html\"\
        ><img alt=\"License: AGPL-3\"
        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://github.com/akretion/ak-odoo-incubator/tree/14.0/stock_inventory_simple_valuation\"\
        ><img alt=\"akretion/ak-odoo-incubator\"
        src=\"https://img.shields.io/badge/github-akretion%2Fak--odoo--incubator-lightgray.png?logo=github\"\
        \ /></a></p>\n<p>This module adds a way to get an approximate evaluation of\
        \ the value of your inventory lines. This is useful in cases where client\
        \ product data is incomplete.</p>\n<p>When there is no standard way to get\
        \ a product\u2019s price, this module looks firstly in the new \u201Cmanual\
        \ cost\u201D field of inventory lines, then in different places to guess the\
        \ price: supplier prices, invoices, purchase orders, etc, in an easily
        extensible\
        \ way.</p>\n<p><strong>Table of contents</strong></p>\n<div class=\"contents\
        \ local topic\" id=\"contents\">\n<ul class=\"simple\">\n<li><a
        class=\"reference\
        \ internal\" href=\"#usage\" id=\"toc-entry-1\">Usage</a></li>\n<li><a class=\"\
        reference internal\" href=\"#bug-tracker\" id=\"toc-entry-2\">Bug
        Tracker</a></li>\n\
