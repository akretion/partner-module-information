        \ class=\"document\" id=\"analytic-activity-based-cost\">\n<h1 class=\"title\"\
        >Analytic Activity Based Cost</h1>\n\n<!--
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! This file is generated by oca-gen-addon-readme !!\n!! changes will be
        overwritten.\
        \                   !!\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! source digest:
        sha256:8ed68991b44660edaa981bfc5cd85a43597699cb870d248fe6e0e91ca618345c\n\
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! -->\n<p><a
        class=\"reference\
        \ external image-reference\"
        href=\"https://odoo-community.org/page/development-status\"\
        ><img alt=\"Alpha\" src=\"https://img.shields.io/badge/maturity-Alpha-red.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"http://www.gnu.org/licenses/agpl-3.0-standalone.html\"\
        ><img alt=\"License: AGPL-3\"
        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://github.com/OCA/account-analytic/tree/14.0/analytic_activity_based_cost\"\
        ><img alt=\"OCA/account-analytic\"
        src=\"https://img.shields.io/badge/github-OCA%2Faccount--analytic-lightgray.png?logo=github\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://translation.odoo-community.org/projects/account-analytic-14-0/account-analytic-14-0-analytic_activity_based_cost\"\
        ><img alt=\"Translate me on Weblate\"
        src=\"https://img.shields.io/badge/weblate-Translate%20me-F47D42.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://runboat.odoo-community.org/builds?repo=OCA/account-analytic&amp;target_branch=14.0\"\
        ><img alt=\"Try me on Runboat\"
        src=\"https://img.shields.io/badge/runboat-Try%20me-875A7B.png\"\
        \ /></a></p>\n<p>With Activity Based Costing (ABC), costs are generated by\
        \ activities.</p>\n<p>Activities generating costs are represented as Analytic\
        \ Items.\nFor example, a timesheet entry could be an activity.\nOther
        activities\
        \ could be captured to be stored in Odoo as Analytic Items.</p>\n<p>These\
        \ activity Analytic Items will automatically generate additional Analytic\
        \ Items\nfor the costs driven this activity.\nFor example, a machine operating\
        \ time could drive consumptions of Labor and Overhead.</p>\n<p>The cost drivers\
        \ are regular non-storable Products, with an additional definition\nof the\
        \ costs they drive.</p>\n<div class=\"admonition important\">\n<p class=\"\
        first admonition-title\">Important</p>\n<p class=\"last\">This is an alpha\
        \ version, the data model and design can change at any time without warning.\n\
        Only for development or testing purpose, do not use in production.\n<a class=\"\
        reference external\"
        href=\"https://odoo-community.org/page/development-status\"\
        >More details on development status</a></p>\n</div>\n<p><strong>Table of
        contents</strong></p>\n\
        <div class=\"contents local topic\" id=\"contents\">\n<ul class=\"simple\"\
        >\n<li><a class=\"reference internal\" href=\"#usage\" id=\"toc-entry-1\"\
        >Usage</a></li>\n<li><a class=\"reference internal\" href=\"#bug-tracker\"\
        \ id=\"toc-entry-2\">Bug Tracker</a></li>\n<li><a class=\"reference internal\"\
        \ href=\"#credits\" id=\"toc-entry-3\">Credits</a><ul>\n<li><a
        class=\"reference\
        \ internal\" href=\"#authors\" id=\"toc-entry-4\">Authors</a></li>\n<li><a\
        \ class=\"reference internal\" href=\"#contributors\"
        id=\"toc-entry-5\">Contributors</a></li>\n\
        <li><a class=\"reference internal\" href=\"#maintainers\" id=\"toc-entry-6\"\
        >Maintainers</a></li>\n</ul>\n</li>\n</ul>\n</div>\n<div class=\"section\"\
        \ id=\"usage\">\n<h1><a class=\"toc-backref\"
        href=\"#toc-entry-1\">Usage</a></h1>\n\
        <p>When creating Analytic Items for a cost driver Product,\nthe corresponding\
        \ Analytic Items for driven cost are generated.</p>\n<ul>\n<li><p class=\"\
        first\">When an Analytic Item is created, an automatic process\nchecks the\
        \ Activity Based Cost Rules to identify the ones that apply.</p>\n</li>\n\
        <li><p class=\"first\">Each rule creates a new Analytic Item for the driven\
        \ costs,\nas a copy of the original one, with:</p>\n<blockquote>\n<ul class=\"\
        simple\">\n<li>Product: set to rule\u2019s Cost Type Product.\nA validation\
        \ error prevents this from being\nthe same as the source Analytic Item Product,\
        \ to avoid infinite loops.</li>\n<li>Cost Quantity: is the original quantity\
        \ multiplied by the rule\u2019s Factor</li>\n<li>Cost Amount: is -1 * Quantity\
        \ * Product Unit  Cost</li>\n<li>Parent Analytic Item (new field): set with\
        \ a link to the original Analytic Item</li>\n<li>Quantity: zero, to avoid\
        \ duplication</li>\n<li>Amount: zero, to avoid duplication</li>\n<li>Project\
        \ and Task: if present, are reset, to avoid representing the driven costs\n\
        as timesheet lines.</li>\n</ul>\n</blockquote>\n</li>\n</ul>\n<p>An update\
        \ on the original Quantity triggers a recalculation of the quantity and amount\
        \ of the child Analytic Items.</p>\n<p>A delete cascades to the child Analytic\
        \ Items, causing them to also be deleted.</p>\n</div>\n<div class=\"section\"\
        \ id=\"bug-tracker\">\n<h1><a class=\"toc-backref\" href=\"#toc-entry-2\"\
        >Bug Tracker</a></h1>\n<p>Bugs are tracked on <a class=\"reference external\"\
