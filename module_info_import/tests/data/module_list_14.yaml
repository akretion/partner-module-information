        \ class=\"document\" id=\"account-usability\">\n<h1 class=\"title\">Account\
        \ Usability</h1>\n\n<!-- !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! This file is generated by oca-gen-addon-readme !!\n!! changes will be
        overwritten.\
        \                   !!\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\
        \ -->\n<p><a class=\"reference external\"
        href=\"https://odoo-community.org/page/development-status\"\
        ><img alt=\"Beta\"
        src=\"https://img.shields.io/badge/maturity-Beta-yellow.png\"\
        \ /></a> <a class=\"reference external\"
        href=\"http://www.gnu.org/licenses/agpl-3.0-standalone.html\"\
        ><img alt=\"License: AGPL-3\"
        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external\"
        href=\"https://github.com/akretion/odoo-usability/tree/12.0/account_usability\"\
        ><img alt=\"akretion/odoo-usability\"
        src=\"https://img.shields.io/badge/github-akretion%2Fodoo--usability-lightgray.png?logo=github\"\
        \ /></a></p>\n<p>This modules adds the following functions:</p>\n<ul class=\"\
        simple\">\n<li>Add an <em>Overdue</em> filter on invoice search view (this\
        \ feature was previously\nlocated in te module
        <em>account_invoice_overdue_filter</em>)</li>\n\
        <li>Increase the default limit of 80 lines in account move and account move\
        \ line view.</li>\n<li>disable reconciliation \u201Cguessing\u201D</li>\n\
        <li>fast search on <em>Reconcile Ref</em> for account move line.</li>\n<li>add\
        \ sale dates to invoice report to be compliant with\n<a class=\"reference\
        \ external\"
        href=\"https://www.service-public.fr/professionnels-entreprises/vosdroits/F31808\"\
        >https://www.service-public.fr/professionnels-entreprises/vosdroits/F31808</a></li>\n\
        <li>Sale date on qweb invoices</li>\n<li>A wizard to mark several invoices\
        \ as sent at once (forward from v8)</li>\n<li>Default date for Account Move\
        \ Reversal is now D+1 instead of today</li>\n<li>Track more fields on invoice\
        \ (see details in account.py)</li>\n<li>Add boolean fields
        <cite>has_discount</cite>\
        \ and <cite>has_attachment</cite> on invoice</li>\n<li>Add button \u201CDelete\
        \ line qty = 0\u201D on supplier invoice</li>\n<li>Cut name_get() of invoice\
        \ if too long</li>\n<li>A script for if Odoo screws up invoice attachment\
        \ filename</li>\n<li>help functions for py3o reports</li>\n<li>Show code on\
        \ name_get of journal</li>\n<li>add direct search of journal using code</li>\n\
        <li>add copy=False on some fields</li>\n<li>Add unicity constraint on analytic\
        \ codes per company</li>\n<li>Better default values on account move</li>\n\
        <li>Add link from account move line to invoice</li>\n<li>Add start_date and\
        \ end_date on bank statements</li>\n<li>Add transfer_account_id to invoicing\
        \ config page</li>\n<li>Improve domain reconciliation
        widget</li>\n<li>account.reconcile.model\
        \ don\u2019t copy name to label via onchange</li>\n<li>Add method to get fiscal\
        \ position without partner_id</li>\n<li>Restore drill-through on sale and\
        \ invoice reports</li>\n<li>don\u2019t attach PDF upon invoice report
        generation\
        \ on supplier invoices/refunds</li>\n<li>Add filter on debit and credit amount\
        \ for Move Lines</li>\n<li>Add supplier invoice number in invoice tree
        view</li>\n\
        </ul>\n<p>Together with this module, I recommend the use of the following\
        \ modules:</p>\n<ul class=\"simple\">\n<li>account_invoice_supplier_ref_unique\
        \ (OCA project account-invoicing)</li>\n<li>account_move_line_no_default_search\
        \ (OCA project
        account-financial-tools)</li>\n<li>invoice_fiscal_position_update\
        \ (OCA project account-invoicing)</li>\n</ul>\n<p><strong>Table of
        contents</strong></p>\n\
        <div class=\"contents local topic\" id=\"contents\">\n<ul class=\"simple\"\
        >\n<li><a class=\"reference internal\" href=\"#bug-tracker\" id=\"id1\">Bug\
        \ Tracker</a></li>\n<li><a class=\"reference internal\" href=\"#credits\"\
        \ id=\"id2\">Credits</a><ul>\n<li><a class=\"reference internal\" href=\"\
        #authors\" id=\"id3\">Authors</a></li>\n<li><a class=\"reference internal\"\
        \ href=\"#contributors\" id=\"id4\">Contributors</a></li>\n<li><a class=\"\
        reference internal\" href=\"#maintainers\" id=\"id5\">Maintainers</a></li>\n\
        </ul>\n</li>\n</ul>\n</div>\n<div class=\"section\" id=\"bug-tracker\">\n\
        <h1><a class=\"toc-backref\" href=\"#id1\">Bug Tracker</a></h1>\n<p>Bugs are\
        \ tracked on <a class=\"reference external\"
        href=\"https://github.com/akretion/odoo-usability/issues\"\
        >GitHub Issues</a>.\nIn case of trouble, please check there if your issue\
        \ has already been reported.\nIf you spotted it first, help us smashing it\
        \ by providing a detailed and welcomed\n<a class=\"reference external\" href=\"\
        https://github.com/akretion/odoo-usability/issues/new?body=module:%20account_usability%0Aversion:%2012.0%0A%0A**Steps%20to%20reproduce**%0A-%20...%0A%0A**Current%20behavior**%0A%0A**Expected%20behavior**\"\
        >feedback</a>.</p>\n<p>Do not contact contributors directly about support\
        \ or help with technical issues.</p>\n</div>\n<div class=\"section\" id=\"\
        credits\">\n<h1><a class=\"toc-backref\" href=\"#id2\">Credits</a></h1>\n\
        <div class=\"section\" id=\"authors\">\n<h2><a class=\"toc-backref\" href=\"\
        #id3\">Authors</a></h2>\n<ul class=\"simple\">\n<li>Akretion</li>\n</ul>\n\
        </div>\n<div class=\"section\" id=\"contributors\">\n<h2><a
        class=\"toc-backref\"\
        \ href=\"#id4\">Contributors</a></h2>\n<ul class=\"simple\">\n<li>Alexis de\
        \ Lattre &lt;<a class=\"reference external\"
        href=\"mailto:alexis.delattre&#64;akretion.com\"\
        >alexis.delattre&#64;akretion.com</a>&gt;</li>\n<li>David Beal &lt;<a class=\"\
        reference external\"
        href=\"mailto:david.beal&#64;akretion.com\">david.beal&#64;akretion.com</a>&gt;</li>\n\
        </ul>\n</div>\n<div class=\"section\" id=\"maintainers\">\n<h2><a class=\"\
        toc-backref\" href=\"#id5\">Maintainers</a></h2>\n<p>This module is part of\
        \ the <a class=\"reference external\"
        href=\"https://github.com/akretion/odoo-usability/tree/12.0/account_usability\"\
        >akretion/odoo-usability</a> project on GitHub.</p>\n<p>You are welcome to\
        \ contribute.</p>\n</div>\n</div>\n</div>\n</body>\n</html>\n"
      development_status: null
      maintainers: []
      name: Account Usability
      summary: Small usability enhancements in account module
