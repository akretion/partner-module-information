        >Account move update analytic</h1>\n\n<!--
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! This file is generated by oca-gen-addon-readme !!\n!! changes will be
        overwritten.\
        \                   !!\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! source digest:
        sha256:51412d898db027daf8b9cc895815cce59ea7292e25b4d0a9feb1245af230d7de\n\
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! -->\n<p><a
        class=\"reference\
        \ external image-reference\"
        href=\"https://odoo-community.org/page/development-status\"\
        ><img alt=\"Beta\"
        src=\"https://img.shields.io/badge/maturity-Beta-yellow.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"http://www.gnu.org/licenses/agpl-3.0-standalone.html\"\
        ><img alt=\"License: AGPL-3\"
        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://github.com/OCA/account-analytic/tree/14.0/account_move_update_analytic\"\
        ><img alt=\"OCA/account-analytic\"
        src=\"https://img.shields.io/badge/github-OCA%2Faccount--analytic-lightgray.png?logo=github\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://translation.odoo-community.org/projects/account-analytic-14-0/account-analytic-14-0-account_move_update_analytic\"\
        ><img alt=\"Translate me on Weblate\"
        src=\"https://img.shields.io/badge/weblate-Translate%20me-F47D42.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://runboat.odoo-community.org/builds?repo=OCA/account-analytic&amp;target_branch=14.0\"\
        ><img alt=\"Try me on Runboat\"
        src=\"https://img.shields.io/badge/runboat-Try%20me-875A7B.png\"\
        \ /></a></p>\n<p>This module allows users to update analytic account and tags\
        \ on account_move lines\nAdds tracking to fields <tt class=\"docutils literal\"\
        >analytic_account_id</tt> and <tt class=\"docutils
        literal\">analytic_tag_ids</tt>\
        \ on move lines</p>\n<p><strong>Table of contents</strong></p>\n<div class=\"\
        contents local topic\" id=\"contents\">\n<ul class=\"simple\">\n<li><a class=\"\
        reference internal\" href=\"#usage\" id=\"toc-entry-1\">Usage</a></li>\n<li><a\
        \ class=\"reference internal\" href=\"#bug-tracker\" id=\"toc-entry-2\">Bug\
        \ Tracker</a></li>\n<li><a class=\"reference internal\" href=\"#credits\"\
        \ id=\"toc-entry-3\">Credits</a><ul>\n<li><a class=\"reference internal\"\
        \ href=\"#authors\" id=\"toc-entry-4\">Authors</a></li>\n<li><a
        class=\"reference\
        \ internal\" href=\"#contributors\" id=\"toc-entry-5\">Contributors</a></li>\n\
        <li><a class=\"reference internal\" href=\"#maintainers\" id=\"toc-entry-6\"\
        >Maintainers</a></li>\n</ul>\n</li>\n</ul>\n</div>\n<div class=\"section\"\
        \ id=\"usage\">\n<h1><a class=\"toc-backref\"
        href=\"#toc-entry-1\">Usage</a></h1>\n\
        <ol class=\"arabic simple\">\n<li>In a posted move, go to the move line you\
        \ want to update, and click on \u2018Update analytic\u2019 to open the wizard.\
        \ (You also have the button directly on account move lines)</li>\n<li>Current\
        \ analytic is shown, you can select another one then click on Confirm</li>\n\
        <li>Analytic lines will be dropped from current analytic account and recreated\
        \ on new analytic account/tags.</li>\n</ol>\n</div>\n<div class=\"section\"\
        \ id=\"bug-tracker\">\n<h1><a class=\"toc-backref\" href=\"#toc-entry-2\"\
        >Bug Tracker</a></h1>\n<p>Bugs are tracked on <a class=\"reference external\"\
        \ href=\"https://github.com/OCA/account-analytic/issues\">GitHub Issues</a>.\n\
        In case of trouble, please check there if your issue has already been
        reported.\n\
        If you spotted it first, help us to smash it by providing a detailed and
        welcomed\n\
        <a class=\"reference external\"
        href=\"https://github.com/OCA/account-analytic/issues/new?body=module:%20account_move_update_analytic%0Aversion:%2014.0%0A%0A**Steps%20to%20reproduce**%0A-%20...%0A%0A**Current%20behavior**%0A%0A**Expected%20behavior**\"\
        >feedback</a>.</p>\n<p>Do not contact contributors directly about support\
        \ or help with technical issues.</p>\n</div>\n<div class=\"section\" id=\"\
        credits\">\n<h1><a class=\"toc-backref\"
