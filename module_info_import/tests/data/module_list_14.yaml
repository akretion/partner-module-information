        \ class=\"document\" id=\"account-analytic-distribution-required\">\n<h1
        class=\"\
        title\">Account Analytic Distribution Required</h1>\n\n<!--
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! This file is generated by oca-gen-addon-readme !!\n!! changes will be
        overwritten.\
        \                   !!\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! source digest:
        sha256:1e870adc2aa0766f9b2e027185b4398eb92982dbe2fd7c7c9198461bb81c79d6\n\
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! -->\n<p><a
        class=\"reference\
        \ external image-reference\"
        href=\"https://odoo-community.org/page/development-status\"\
        ><img alt=\"Beta\"
        src=\"https://img.shields.io/badge/maturity-Beta-yellow.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"http://www.gnu.org/licenses/agpl-3.0-standalone.html\"\
        ><img alt=\"License: AGPL-3\"
        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://github.com/OCA/account-analytic/tree/14.0/account_analytic_distribution_required\"\
        ><img alt=\"OCA/account-analytic\"
        src=\"https://img.shields.io/badge/github-OCA%2Faccount--analytic-lightgray.png?logo=github\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://translation.odoo-community.org/projects/account-analytic-14-0/account-analytic-14-0-account_analytic_distribution_required\"\
        ><img alt=\"Translate me on Weblate\"
        src=\"https://img.shields.io/badge/weblate-Translate%20me-F47D42.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://runboat.odoo-community.org/builds?repo=OCA/account-analytic&amp;target_branch=14.0\"\
        ><img alt=\"Try me on Runboat\"
        src=\"https://img.shields.io/badge/runboat-Try%20me-875A7B.png\"\
        \ /></a></p>\n<p>This module extends account_analytic_required and adds 2\
        \ policies to\ncontrol the use of analytic distributions. The policies behave\
        \ as follow</p>\n<ul class=\"simple\">\n<li>never: no analytic account nor\
        \ analytic distribution allowed</li>\n<li>always: analytic account
        required</li>\n\
        <li>always_plan: analytic_distribution
        required</li>\n<li>always_plan_or_account:\
        \ analytic distribution or analytic account required</li>\n<li>optional: do\
        \ what you like,</li>\n</ul>\n<p>In any case analytic account and analytic\
        \ distribution are mutually exclusive.</p>\n<p><strong>Table of
        contents</strong></p>\n\
        <div class=\"contents local topic\" id=\"contents\">\n<ul class=\"simple\"\
        >\n<li><a class=\"reference internal\" href=\"#configuration\"
        id=\"toc-entry-1\"\
        >Configuration</a></li>\n<li><a class=\"reference internal\" href=\"#usage\"\
        \ id=\"toc-entry-2\">Usage</a></li>\n<li><a class=\"reference internal\"
        href=\"\
        #bug-tracker\" id=\"toc-entry-3\">Bug Tracker</a></li>\n<li><a
        class=\"reference\
        \ internal\" href=\"#credits\" id=\"toc-entry-4\">Credits</a><ul>\n<li><a\
        \ class=\"reference internal\" href=\"#authors\"
        id=\"toc-entry-5\">Authors</a></li>\n\
        <li><a class=\"reference internal\" href=\"#contributors\" id=\"toc-entry-6\"\
        >Contributors</a></li>\n<li><a class=\"reference internal\"
        href=\"#maintainers\"\
        \ id=\"toc-entry-7\">Maintainers</a></li>\n</ul>\n</li>\n</ul>\n</div>\n<div\
        \ class=\"section\" id=\"configuration\">\n<h1><a class=\"toc-backref\" href=\"\
        #toc-entry-1\">Configuration</a></h1>\n<p>To configure this module, you need\
        \ to:</p>\n<ol class=\"arabic simple\">\n<li>Go to <em>Invoicing &gt;
        Configuration\
        \ &gt; Accounting &gt; Account\nTypes</em> and select the correct
        <strong>Policy\
        \ for analytic account</strong> for every\naccount type you want.</li>\n</ol>\n\
        </div>\n<div class=\"section\" id=\"usage\">\n<h1><a class=\"toc-backref\"\
        \ href=\"#toc-entry-2\">Usage</a></h1>\n<p>To use this module, you need
        to:</p>\n\
        <ol class=\"arabic simple\">\n<li>Create an invoice and add a line with an\
        \ account of the same type you\nare configured above.</li>\n<li>Add a tag\
        \ that has an analytical distribution\n(\u2018Analytic Distribution\u2019\
        \ field set to true) or an analytic account to that\nline.</li>\n<li>When\
        \ you validate the invoice you get a message if analytic account
        or\ndistribution\
        \ are incorrect.</li>\n</ol>\n</div>\n<div class=\"section\" id=\"bug-tracker\"\
        >\n<h1><a class=\"toc-backref\" href=\"#toc-entry-3\">Bug Tracker</a></h1>\n\
        <p>Bugs are tracked on <a class=\"reference external\"
        href=\"https://github.com/OCA/account-analytic/issues\"\
        >GitHub Issues</a>.\nIn case of trouble, please check there if your issue\
        \ has already been reported.\nIf you spotted it first, help us to smash it\
        \ by providing a detailed and welcomed\n<a class=\"reference external\" href=\"\
        https://github.com/OCA/account-analytic/issues/new?body=module:%20account_analytic_distribution_required%0Aversion:%2014.0%0A%0A**Steps%20to%20reproduce**%0A-%20...%0A%0A**Current%20behavior**%0A%0A**Expected%20behavior**\"\
        >feedback</a>.</p>\n<p>Do not contact contributors directly about support\
        \ or help with technical issues.</p>\n</div>\n<div class=\"section\" id=\"\
        credits\">\n<h1><a class=\"toc-backref\"
        href=\"#toc-entry-4\">Credits</a></h1>\n\
        <div class=\"section\" id=\"authors\">\n<h2><a class=\"toc-backref\" href=\"\
        #toc-entry-5\">Authors</a></h2>\n<ul class=\"simple\">\n<li>ACSONE SA/NV</li>\n\
        <li>Tecnativa</li>\n</ul>\n</div>\n<div class=\"section\" id=\"contributors\"\
        >\n<h2><a class=\"toc-backref\" href=\"#toc-entry-6\">Contributors</a></h2>\n\
        <ul class=\"simple\">\n<li>St\xE9phane Bidoul &lt;<a class=\"reference
        external\"\
        \
        href=\"mailto:stephane.bidoul&#64;acsone.eu\">stephane.bidoul&#64;acsone.eu</a>&gt;</li>\n\
        <li><a class=\"reference external\"
        href=\"https://www.tecnativa.com\">Tecnativa</a>:<ul>\n\
        <li>Vicent Cubells</li>\n<li>Ernesto Tejeda</li>\n</ul>\n</li>\n</ul>\n</div>\n\
