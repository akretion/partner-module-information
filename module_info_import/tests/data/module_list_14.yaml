        ><img alt=\"License: AGPL-3\"
        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://github.com/OCA/account-analytic/tree/14.0/analytic_partner_hr_timesheet\"\
        ><img alt=\"OCA/account-analytic\"
        src=\"https://img.shields.io/badge/github-OCA%2Faccount--analytic-lightgray.png?logo=github\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://translation.odoo-community.org/projects/account-analytic-14-0/account-analytic-14-0-analytic_partner_hr_timesheet\"\
        ><img alt=\"Translate me on Weblate\"
        src=\"https://img.shields.io/badge/weblate-Translate%20me-F47D42.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://runboat.odoo-community.org/builds?repo=OCA/account-analytic&amp;target_branch=14.0\"\
        ><img alt=\"Try me on Runboat\"
        src=\"https://img.shields.io/badge/runboat-Try%20me-875A7B.png\"\
        \ /></a></p>\n<p>This module adds another partner on HR timesheets and
        propagate\
        \ it to the\nauto-generated analytic entries on the \u201COther partner\u201D\
        \ field.</p>\n<p><strong>Table of contents</strong></p>\n<div class=\"contents\
        \ local topic\" id=\"contents\">\n<ul class=\"simple\">\n<li><a
        class=\"reference\
        \ internal\" href=\"#installation\" id=\"toc-entry-1\">Installation</a></li>\n\
        <li><a class=\"reference internal\" href=\"#usage\"
        id=\"toc-entry-2\">Usage</a></li>\n\
        <li><a class=\"reference internal\" href=\"#bug-tracker\" id=\"toc-entry-3\"\
        >Bug Tracker</a></li>\n<li><a class=\"reference internal\" href=\"#credits\"\
        \ id=\"toc-entry-4\">Credits</a><ul>\n<li><a class=\"reference internal\"\
