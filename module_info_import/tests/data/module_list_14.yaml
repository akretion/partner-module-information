        \ /></a></p>\n<p>This module adds an option <em>analytic policy</em> on account\
        \ types.\nYou have the choice between 4 policies : <em>always</em>,
        <em>never</em>,\
        \ <em>posted moves</em> and <em>optional</em>.</p>\n<p><strong>Table of
        contents</strong></p>\n\
        <div class=\"contents local topic\" id=\"contents\">\n<ul class=\"simple\"\
