        src=\"https://img.shields.io/badge/github-akretion%2Fpartner--module--information-lightgray.png?logo=github\"\
        \ /></a></p>\n<p>Allow to gather information about all Odoo modules, its
        available\
        \ versions.\nAllow to gather information about used module in partner\u2019\
        \ odoo instance.</p>\n<p>It can be used for make statistics about more used\
        \ modules\nOr to analyze the work todo for a migration,
        etc\u2026</p>\n<p><strong>Table\
