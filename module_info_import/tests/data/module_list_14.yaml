        \ class=\"document\" id=\"analytic-accounting-support-for-wip-and-variances\"\
        >\n<h1 class=\"title\">Analytic Accounting support for WIP and Variances</h1>\n\
        \n<!-- !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n!! This file\
        \ is generated by oca-gen-addon-readme !!\n!! changes will be overwritten.\
        \                   !!\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! source digest:
        sha256:ea297de7caa6e03255622ed482652cb6df302eb85791dc484c71446526b3598e\n\
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! -->\n<p><a
        class=\"reference\
        \ external image-reference\"
        href=\"https://odoo-community.org/page/development-status\"\
        ><img alt=\"Alpha\" src=\"https://img.shields.io/badge/maturity-Alpha-red.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"http://www.gnu.org/licenses/agpl-3.0-standalone.html\"\
        ><img alt=\"License: AGPL-3\"
        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://github.com/OCA/account-analytic/tree/14.0/account_analytic_wip\"\
        ><img alt=\"OCA/account-analytic\"
        src=\"https://img.shields.io/badge/github-OCA%2Faccount--analytic-lightgray.png?logo=github\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://translation.odoo-community.org/projects/account-analytic-14-0/account-analytic-14-0-account_analytic_wip\"\
        ><img alt=\"Translate me on Weblate\"
        src=\"https://img.shields.io/badge/weblate-Translate%20me-F47D42.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://runboat.odoo-community.org/builds?repo=OCA/account-analytic&amp;target_branch=14.0\"\
        ><img alt=\"Try me on Runboat\"
        src=\"https://img.shields.io/badge/runboat-Try%20me-875A7B.png\"\
        \ /></a></p>\n<p>This feature proposes a strategy to track and report work\
        \ in progress and variances.\nThe work in progress can be split in subitems,\
        \ such as Labour and Overhead.</p>\n<p>The base components are implemented\
        \ here, a minimum viable process is working,\nbut the process is best leveraged\
        \ by other apps, such as Projects or Manufacturing.</p>\n<p>Resource
        consumption\
        \ is to be recorded as Analytic Items\nwhen operations are logged in the system\
        \ of resources.</p>\n<p>These Analytic Items are then used to calculate WIP\
        \ and variances\nversus the original expected amounts.\nAn \u201CAnalytic\
        \ Tracking Items\u201D object is used to hold the expected amount,\nand
        calculate\
        \ the WIP and variances to record.</p>\n<p>A regular scheduled job uses that\
        \ information\nto generate the corresponding accounting moves.</p>\n<p>Products\
        \ can be seen as cost drivers, driving consumption of other items.\nFor example\
        \ a machine work time can drive consumptions of Labor and Overhead.</p>\n\
        <p>When an Analytic Item is created for a cost driver,\nadditional Analytic\
        \ Items are generated for the corresponding indirect costs.\nFor example,\
        \ each timesheet hour logged could generate a overhead amount related to that\
        \ activity.</p>\n<div class=\"admonition important\">\n<p class=\"first
        admonition-title\"\
        >Important</p>\n<p class=\"last\">This is an alpha version, the data model\
        \ and design can change at any time without warning.\nOnly for development\
        \ or testing purpose, do not use in production.\n<a class=\"reference
        external\"\
        \ href=\"https://odoo-community.org/page/development-status\">More details\
        \ on development status</a></p>\n</div>\n<p><strong>Table of
        contents</strong></p>\n\
        <div class=\"contents local topic\" id=\"contents\">\n<ul class=\"simple\"\
        >\n<li><a class=\"reference internal\" href=\"#usage\" id=\"toc-entry-1\"\
        >Usage</a></li>\n<li><a class=\"reference internal\" href=\"#bug-tracker\"\
        \ id=\"toc-entry-2\">Bug Tracker</a></li>\n<li><a class=\"reference internal\"\
        \ href=\"#credits\" id=\"toc-entry-3\">Credits</a><ul>\n<li><a
        class=\"reference\
        \ internal\" href=\"#authors\" id=\"toc-entry-4\">Authors</a></li>\n<li><a\
        \ class=\"reference internal\" href=\"#contributors\"
        id=\"toc-entry-5\">Contributors</a></li>\n\
        <li><a class=\"reference internal\" href=\"#maintainers\" id=\"toc-entry-6\"\
        >Maintainers</a></li>\n</ul>\n</li>\n</ul>\n</div>\n<div class=\"section\"\
        \ id=\"usage\">\n<h1><a class=\"toc-backref\"
        href=\"#toc-entry-1\">Usage</a></h1>\n\
        <p>The \u201CAnalytic Tracking Items\u201D holds planned amounts, and tracks\
        \ their WIP and variances.\nThese must be automatically created by specific\
        \ logic in the Apps supporting them.</p>\n<p>With this module alone the
        Tracking\
        \ Item creation can be done manually:</p>\n<ul class=\"simple\">\n<li>Navigate\
        \ to \u2018\u2019Invoicing/Accounting &gt; Reporting &gt; Management &gt;\
        \ Analytic Tracking\u2019\u2019</li>\n<li>Create an Analytic Tracking
        Item:<ul>\n\
        <li>Set the Analytic Account.</li>\n<li>Set the Product, use one that has\
        \ a non-zero cost\nand belongs to a category with the \u201CCosting\u201D\
        \ section configured.</li>\n<li>Set the Planned Amount.</li>\n</ul>\n</li>\n\
        </ul>\n<p>Analytic Items are used to record the actual costs:</p>\n<ul class=\"\
        simple\">\n<li>Navigate to <em>Invoicing/Accounting &gt; Configuration\n&gt;\
        \ Analytic Accounting &gt; Analytic Items</em>.</li>\n<li>Create an Analytic\
        \ Item:<ul>\n<li>Set the Analytic Account, Description and Date.</li>\n<li>Set\
        \ the Product, use one that has a non-zero cost\nand belongs to a category\
        \ with the \u201CCosting\u201D section configured.</li>\n<li>Set the quantity\
        \ consumed.</li>\n<li>The Amount field should be automatically computed, with\
        \ a negative amount.</li>\n</ul>\n</li>\n</ul>\n<p>Analytic Tracking Items\
        \ are used to follow the costs incurred\nand the comparison with the planned\
        \ amounts. This can be used for analysis:</p>\n<ul
        class=\"simple\">\n<li>Navigate\
        \ to \u2018\u2019Invoicing/Accounting &gt; Reporting &gt; Management &gt;\
        \ Analytic Tracking\u2019\u2019</li>\n<li>The list presents lines being
        tracked,\
        \ and displays columns with Actual Amount,\nExpected Amount, WIP Amount,
        Variance\
        \ Amount, etc.</li>\n</ul>\n<p>WIP and variances journal entries are generated\
        \ by a scheduled job:</p>\n<ul class=\"simple\">\n<li>Navigate to <em>Setting\
        \ &gt; Technical &gt; Automation &gt; Scheduled Actions</em>.</li>\n<li>Locate\
        \ and open the <em>Account: Process WIP and Variances</em> record, and click\
        \ on the RUN MANUALLY button.</li>\n<li>Check the generated journal entries,\
        \ at <em>Accounting &gt; Miscellaneous &gt; Journal Entries</em>.</li>\n</ul>\n\
        <p>When creating Analytic Items, if a configuration is in place, the
        corresponding\
        \ Analytic Items for indirect cost are generated.</p>\n<ul class=\"simple\"\
        >\n<li>When an Analytic Item is created, an automatic process checks the
        Activity\
        \ Based Cost Rules to identify the ones that apply.</li>\n<li>Each triggered\
        \ rule created a new Analytic Item, with a copy of the original one, and:<ul>\n\
        <li>Product: is the rule Cost Type Product. A validation error prevents this\
        \ from being the same as the source Analytic Item Product, to avoid infinite\
        \ loops.</li>\n<li>Quantity: is the original quantity multiplied by the
        rule\u2019\
        s Factor</li>\n<li>Amount: is -1 * Quantity * Product Standard Price</li>\n\
        <li>Parent Analytic Item (new field): set with the original Analytic
        Item</li>\n\
        </ul>\n</li>\n<li>An update on the Quantity triggers a recalculation of the\
        \ quantity and amount of the child Analytic Items.</li>\n<li>A delete cascades\
        \ to the child Analytic Items, causing them to also be deleted.</li>\n</ul>\n\
        </div>\n<div class=\"section\" id=\"bug-tracker\">\n<h1><a
        class=\"toc-backref\"\
        \ href=\"#toc-entry-2\">Bug Tracker</a></h1>\n<p>Bugs are tracked on <a
        class=\"\
        reference external\" href=\"https://github.com/OCA/account-analytic/issues\"\
        >GitHub Issues</a>.\nIn case of trouble, please check there if your issue\
        \ has already been reported.\nIf you spotted it first, help us to smash it\
        \ by providing a detailed and welcomed\n<a class=\"reference external\" href=\"\
        https://github.com/OCA/account-analytic/issues/new?body=module:%20account_analytic_wip%0Aversion:%2014.0%0A%0A**Steps%20to%20reproduce**%0A-%20...%0A%0A**Current%20behavior**%0A%0A**Expected%20behavior**\"\
        >feedback</a>.</p>\n<p>Do not contact contributors directly about support\
        \ or help with technical issues.</p>\n</div>\n<div class=\"section\" id=\"\
        credits\">\n<h1><a class=\"toc-backref\"
        href=\"#toc-entry-3\">Credits</a></h1>\n\
        <div class=\"section\" id=\"authors\">\n<h2><a class=\"toc-backref\" href=\"\
        #toc-entry-4\">Authors</a></h2>\n<ul class=\"simple\">\n<li>Open Source
        Integrators</li>\n\
        </ul>\n</div>\n<div class=\"section\" id=\"contributors\">\n<h2><a class=\"\
        toc-backref\" href=\"#toc-entry-5\">Contributors</a></h2>\n<ul class=\"simple\"\
        >\n<li><cite>Open Source Integrators
        &lt;https://opensourceintegrators.com&gt;</cite>:<ul>\n\
        <li>Daniel Reis &lt;<a class=\"reference external\"
        href=\"mailto:dreis&#64;opensourceintegrators.com\"\
        >dreis&#64;opensourceintegrators.com</a>&gt;</li>\n<li>Chandresh Thakkar &lt;<a\
        \ class=\"reference external\"
        href=\"mailto:cthakkar&#64;opensourceintegrators.com\"\
        >cthakkar&#64;opensourceintegrators.com</a>&gt;</li>\n</ul>\n</li>\n</ul>\n\
        </div>\n<div class=\"section\" id=\"maintainers\">\n<h2><a
        class=\"toc-backref\"\
        \ href=\"#toc-entry-6\">Maintainers</a></h2>\n<p>This module is maintained\
        \ by the OCA.</p>\n<a class=\"reference external image-reference\" href=\"\
        https://odoo-community.org\"><img alt=\"Odoo Community Association\" src=\"\
        https://odoo-community.org/logo.png\" /></a>\n<p>OCA, or the Odoo Community\
        \ Association, is a nonprofit organization whose\nmission is to support the\
        \ collaborative development of Odoo features and\npromote its widespread
        use.</p>\n\
        <p>Current <a class=\"reference external\"
        href=\"https://odoo-community.org/page/maintainer-role\"\
        >maintainer</a>:</p>\n<p><a class=\"reference external image-reference\"
        href=\"\
        https://github.com/dreispt\"><img alt=\"dreispt\"
        src=\"https://github.com/dreispt.png?size=40px\"\
        \ /></a></p>\n<p>This module is part of the <a class=\"reference external\"\
        \
        href=\"https://github.com/OCA/account-analytic/tree/14.0/account_analytic_wip\"\
        >OCA/account-analytic</a> project on GitHub.</p>\n<p>You are welcome to
        contribute.\
        \ To learn how please visit <a class=\"reference external\"
        href=\"https://odoo-community.org/page/Contribute\"\
        >https://odoo-community.org/page/Contribute</a>.</p>\n</div>\n</div>\n</div>\n\
        </body>\n</html>\n"
      development_status: Alpha
      maintainers:
        - dreispt
      name: Analytic Accounting support for WIP and Variances
      summary: Track and report WIP and Variances based on Analytic Items
