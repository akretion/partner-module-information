        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://github.com/akretion/ak-odoo-incubator/tree/14.0/proxy_action\"\
        ><img alt=\"akretion/ak-odoo-incubator\"
        src=\"https://img.shields.io/badge/github-akretion%2Fak--odoo--incubator-lightgray.png?logo=github\"\
        \ /></a></p>\n<p>Communicate from Odoo (js client-side) to a localhost http\
        \ server.</p>\n<p>Common use cases:</p>\n<blockquote>\n<ul class=\"simple\"\
        >\n<li>print a receipt or a label from Odoo\u2019s backend or POS directly\
        \ to user\u2019s printer.</li>\n<li>drive your heavy robot from Odoo</li>\n\
        <li>Forward to pywebdriver odoo\u2019s actions.</li>\n</ul>\n</blockquote>\n\
        <p><strong>Table of contents</strong></p>\n<div class=\"contents local topic\"\
        \ id=\"contents\">\n<ul class=\"simple\">\n<li><a class=\"reference internal\"\
