        >Configuration</a></h1>\n<p>Go on each partner for who you want to collect\
        \ information about its module and\n<strong>fill the field
        module_auth_api_key_id</strong>\
        \ with the key used in the partner\u2019s Odoo instance.\nAnd <strong>fill\
