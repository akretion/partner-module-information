        ><img alt=\"ChrisOForgeFlow\"
        src=\"https://github.com/ChrisOForgeFlow.png?size=40px\"\
        \ /></a></p>\n<p>This module is part of the <a class=\"reference external\"\
        \
        href=\"https://github.com/OCA/rma/tree/14.0/account_mass_reconcile_by_rma_line\"\
        >OCA/rma</a> project on GitHub.</p>\n<p>You are welcome to contribute. To\
