        Usability</h1>\n\
        \n<!-- !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n!! This file\
        \ is generated by oca-gen-addon-readme !!\n!! changes will be overwritten.\
        \                   !!\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\
        \ -->\n<p><a class=\"reference external\"
        href=\"https://odoo-community.org/page/development-status\"\
        ><img alt=\"Beta\"
        src=\"https://img.shields.io/badge/maturity-Beta-yellow.png\"\
        \ /></a> <a class=\"reference external\"
        href=\"http://www.gnu.org/licenses/agpl-3.0-standalone.html\"\
        ><img alt=\"License: AGPL-3\"
        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external\"
        href=\"https://github.com/akretion/odoo-usability/tree/12.0/base_usability\"\
        ><img alt=\"akretion/odoo-usability\"
        src=\"https://img.shields.io/badge/github-akretion%2Fodoo--usability-lightgray.png?logo=github\"\
        \ /></a></p>\n<p>This module adds the following functions:</p>\n<ul class=\"\
        simple\">\n<li>Adds <em>track_visibility=\u2019onchange\u2019</em> on all\
        \ the important fields of the Partner object</li>\n<li>By default, Odoo
        doesn\u2019\
        t display the title field on all the partner form views. This module fixes\
        \ it (it replaces the module base_title_on_partner)</li>\n<li>Adds a log
        message\
        \ at INFO level when sending an email via SMTP</li>\n<li>Displays the local\
        \ modules with installable filter</li>\n<li>A group by \u201CState\u201D is\
        \ added to module search view</li>\n<li>Provides a _display_report_header\
        \ method on the res.company object and _display_full_address on res.partner\
        \ which are useful for reporting.</li>\n<li>Add model in cron tree view</li>\n\
        <li>Add prefix field in sequence search view</li>\n<li>Better search and form\
        \ view for country and state</li>\n<li>Display technical name of modules in\
        \ kanban view</li>\n<li>Change module filter to <cite>installable</cite></li>\n\
        <li>Add widget=handle on sequence of res.partner.bank</li>\n<li>Add city and\
        \ country in partner tree view</li>\n<li>Add widget=\u201Demail\u201D on email\
        \ of contacts</li>\n<li>Add script to fix partners related to users in
        multi-company\
        \ setup</li>\n<li>Add methods for py3o reports</li>\n<li>Add name_get() on\
        \ ir.model</li>\n<li>Language wizard defaults to \u201C.po\u201D</li>\n<li>Add\
        \ tracking on partner fields</li>\n<li>Handle lang in name_title field</li>\n\
        <li>Remove empty lines in address</li>\n<li>Add bank Name field on
        res.partner.bank</li>\n\
        <li>Partners auto-created for users are Suppliers and not Customers</li>\n\
        </ul>\n<p><strong>Table of contents</strong></p>\n<div class=\"contents local\
        \ topic\" id=\"contents\">\n<ul class=\"simple\">\n<li><a class=\"reference\
        \ internal\" href=\"#bug-tracker\" id=\"id1\">Bug Tracker</a></li>\n<li><a\
        \ class=\"reference internal\" href=\"#credits\" id=\"id2\">Credits</a><ul>\n\
        <li><a class=\"reference internal\" href=\"#authors\"
        id=\"id3\">Authors</a></li>\n\
        <li><a class=\"reference internal\" href=\"#contributors\"
        id=\"id4\">Contributors</a></li>\n\
        <li><a class=\"reference internal\" href=\"#maintainers\"
        id=\"id5\">Maintainers</a></li>\n\
        </ul>\n</li>\n</ul>\n</div>\n<div class=\"section\" id=\"bug-tracker\">\n\
        <h1><a class=\"toc-backref\" href=\"#id1\">Bug Tracker</a></h1>\n<p>Bugs are\
        \ tracked on <a class=\"reference external\"
        href=\"https://github.com/akretion/odoo-usability/issues\"\
        >GitHub Issues</a>.\nIn case of trouble, please check there if your issue\
