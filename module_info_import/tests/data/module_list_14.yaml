        \ simple\">\n<li>Set required tag dimension</li>\n<li>Select tags by dimension\
        \ sequence</li>\n<li>Mass create tags based on model data</li>\n<li>Filter\
        \ subsequence tag selections based on previous selected tag\u2019s
        dimension</li>\n\
        </ol>\n<p><strong>Table of contents</strong></p>\n<div class=\"contents local\
        \ topic\" id=\"contents\">\n<ul class=\"simple\">\n<li><a class=\"reference\
        \ internal\" href=\"#configuration\"
