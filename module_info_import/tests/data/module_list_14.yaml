        src=\"https://img.shields.io/badge/github-akretion%2Fodoo--usability-lightgray.png?logo=github\"\
        \ /></a></p>\n<p>This modules adds the following functions:</p>\n<ul class=\"\
        simple\">\n<li>Display amount untaxed in tree view</li>\n<li>Add sale_ids\
        \ and sale_count on Invoice</li>\n<li>Methods for py3o sale reports</li>\n\
        <li>Add tracking on partner warning fields</li>\n<li>Add tracking on product\
        \ fields</li>\n<li>Add tracking on Sale Order fields</li>\n<li>Add menu for\
        \ Pricelist Items</li>\n<li>Add <cite>has_discount</cite> field on Sale
        Order</li>\n\
        <li>Restore drill-through on sale and invoice reports</li>\n<li>Move
        client_order_ref\
        \ from the second tab to the top</li>\n<li>Protect Cancel button with a
        confirmation\
        \ pop-up</li>\n<li>Remove Sale Orders from Quotations menu</li>\n<li>Add Group\
        \ By Customer on Sales order search view</li>\n<li>Add sum=1 on several
        quantity\
        \ fields</li>\n<li>Add Product Category Menu
        entry</li>\n</ul>\n<p><strong>Table\
        \ of contents</strong></p>\n<div class=\"contents local topic\" id=\"contents\"\
        >\n<ul class=\"simple\">\n<li><a class=\"reference internal\"
