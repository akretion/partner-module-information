        src=\"https://img.shields.io/badge/github-ForgeFlow%2Fstock--rma-lightgray.png?logo=github\"\
        \ /></a></p>\n<p>This module adds a new fields \u201CUnreconciled\u201D on\
        \ RMA Order Lines, that allows\nto find Order\u2019s with unreconciled journal\
        \ items related.</p>\n<p>This module allows to  reconcile those Orders in\
        \ a single click. In accounting\nsettings users will be able to set up a
        specific\
        \ account for write-off.</p>\n<p><strong>Table of contents</strong></p>\n\
