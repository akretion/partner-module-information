        href=\"https://github.com/OCA/rma/tree/14.0/account_mass_reconcile_by_rma_line\"\
        ><img alt=\"OCA/rma\"
        src=\"https://img.shields.io/badge/github-OCA%2Frma-lightgray.png?logo=github\"\
        \ /></a> <a class=\"reference external\"
