        \ class=\"document\" id=\"analytic-accounts-dimensions\">\n<h1 class=\"title\"\
        >Analytic Accounts Dimensions</h1>\n\n<!--
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! This file is generated by oca-gen-addon-readme !!\n!! changes will be
        overwritten.\
        \                   !!\n!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!\n\
        !! source digest:
        sha256:470164c35f6337425c326d4797ff5b6a60be67ee847f617df8302de6209a7af5\n\
        !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!! -->\n<p><a
        class=\"reference\
        \ external image-reference\"
        href=\"https://odoo-community.org/page/development-status\"\
        ><img alt=\"Beta\"
        src=\"https://img.shields.io/badge/maturity-Beta-yellow.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"http://www.gnu.org/licenses/agpl-3.0-standalone.html\"\
        ><img alt=\"License: AGPL-3\"
        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://github.com/OCA/account-analytic/tree/14.0/analytic_tag_dimension\"\
        ><img alt=\"OCA/account-analytic\"
        src=\"https://img.shields.io/badge/github-OCA%2Faccount--analytic-lightgray.png?logo=github\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://translation.odoo-community.org/projects/account-analytic-14-0/account-analytic-14-0-analytic_tag_dimension\"\
        ><img alt=\"Translate me on Weblate\"
        src=\"https://img.shields.io/badge/weblate-Translate%20me-F47D42.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://runboat.odoo-community.org/builds?repo=OCA/account-analytic&amp;target_branch=14.0\"\
        ><img alt=\"Try me on Runboat\"
        src=\"https://img.shields.io/badge/runboat-Try%20me-875A7B.png\"\
        \ /></a></p>\n<p>This module allows to group Analytic Tags on Dimensions.</p>\n\
        <p>Dimensions are created as custom field, then you can group by Dimensions\
        \ on:</p>\n<ul class=\"simple\">\n<li>Account/Adviser/Journal Items</li>\n\
        <li>Account/Reports/Business Intelligence/Analytic Entries</li>\n</ul>\n<p>When\
        \ you set Tags on Analytic Entries, each custom field for dimensions is updated\
        \ with its Tag.</p>\n<p>One Tag is only allowed on one Dimension, and you\
        \ can not set more than one Tag from same Dimensions on Analytic Entry.</p>\n\
        <p><strong>Table of contents</strong></p>\n<div class=\"contents local topic\"\
        \ id=\"contents\">\n<ul class=\"simple\">\n<li><a class=\"reference internal\"\
        \ href=\"#configuration\" id=\"toc-entry-1\">Configuration</a></li>\n<li><a\
        \ class=\"reference internal\" href=\"#known-issues-roadmap\"
        id=\"toc-entry-2\"\
        >Known issues / Roadmap</a></li>\n<li><a class=\"reference internal\" href=\"\
        #bug-tracker\" id=\"toc-entry-3\">Bug Tracker</a></li>\n<li><a
        class=\"reference\
        \ internal\" href=\"#credits\" id=\"toc-entry-4\">Credits</a><ul>\n<li><a\
        \ class=\"reference internal\" href=\"#authors\"
        id=\"toc-entry-5\">Authors</a></li>\n\
        <li><a class=\"reference internal\" href=\"#contributors\" id=\"toc-entry-6\"\
        >Contributors</a></li>\n<li><a class=\"reference internal\"
        href=\"#other-credits\"\
        \ id=\"toc-entry-7\">Other credits</a></li>\n<li><a class=\"reference
        internal\"\
        \ href=\"#maintainers\" id=\"toc-entry-8\">Maintainers</a></li>\n</ul>\n</li>\n\
        </ul>\n</div>\n<div class=\"section\" id=\"configuration\">\n<h1><a class=\"\
        toc-backref\" href=\"#toc-entry-1\">Configuration</a></h1>\n<p>To configure\
        \ this module, you need to:</p>\n<ul class=\"simple\">\n<li>go to
        /Invoicing/Configuration/Analytic\
        \ Accounting/Analytic Accounts Dimensions to create new Analytic
        Dimensions.</li>\n\
        <li>You can create new Analytic Tags on this form, or go to
        /Invoicing/Configuration/Analytic\
        \ Accounting/Analytic Tags and set Dimension for each
        Tag.</li>\n</ul>\n</div>\n\
        <div class=\"section\" id=\"known-issues-roadmap\">\n<h1><a
        class=\"toc-backref\"\
        \ href=\"#toc-entry-2\">Known issues / Roadmap</a></h1>\n<ul class=\"simple\"\
        >\n<li>Analytic Entries with Tags created before installing this module are\
        \ not updated with theirs Dimensions.</li>\n<li>Set color on Analytic
        Dimensions,\
        \ and get it on Analytic Tags.</li>\n<li>Change implementation to create stored\
        \ computed fields, instead of rewrite create and write functions.</li>\n<li>On\
        \ the function that create fields, get all the models that inherit from
        AbstractModel</li>\n\
        <li>Set dimension on invoice report</li>\n<li>Improve fields_view_get to create\
        \ filters on search view</li>\n</ul>\n</div>\n<div class=\"section\" id=\"\
        bug-tracker\">\n<h1><a class=\"toc-backref\" href=\"#toc-entry-3\">Bug
        Tracker</a></h1>\n\
        <p>Bugs are tracked on <a class=\"reference external\"
        href=\"https://github.com/OCA/account-analytic/issues\"\
        >GitHub Issues</a>.\nIn case of trouble, please check there if your issue\
        \ has already been reported.\nIf you spotted it first, help us to smash it\
        \ by providing a detailed and welcomed\n<a class=\"reference external\" href=\"\
        https://github.com/OCA/account-analytic/issues/new?body=module:%20analytic_tag_dimension%0Aversion:%2014.0%0A%0A**Steps%20to%20reproduce**%0A-%20...%0A%0A**Current%20behavior**%0A%0A**Expected%20behavior**\"\
        >feedback</a>.</p>\n<p>Do not contact contributors directly about support\
        \ or help with technical issues.</p>\n</div>\n<div class=\"section\" id=\"\
        credits\">\n<h1><a class=\"toc-backref\"
        href=\"#toc-entry-4\">Credits</a></h1>\n\
        <div class=\"section\" id=\"authors\">\n<h2><a class=\"toc-backref\" href=\"\
        #toc-entry-5\">Authors</a></h2>\n<ul
        class=\"simple\">\n<li>PESOL</li>\n<li>Tecnativa</li>\n\
        </ul>\n</div>\n<div class=\"section\" id=\"contributors\">\n<h2><a class=\"\
        toc-backref\" href=\"#toc-entry-6\">Contributors</a></h2>\n<ul class=\"simple\"\
        >\n<li>Angel Moya &lt;<a class=\"reference external\"
        href=\"mailto:angel.moya&#64;pesol.es\"\
        >angel.moya&#64;pesol.es</a>&gt;</li>\n<li>Artem Kostyuk &lt;<a
        class=\"reference\
        \ external\"
        href=\"mailto:a.kostyuk&#64;mobilunity.com\">a.kostyuk&#64;mobilunity.com</a>&gt;</li>\n\
        <li>Jaume Planas &lt;<a class=\"reference external\"
        href=\"mailto:jaume.planas&#64;minorisa.net\"\
        >jaume.planas&#64;minorisa.net</a>&gt;</li>\n<li><a class=\"reference
        external\"\
        \ href=\"https://www.tecnativa.com\">Tecnativa</a>:<ul>\n<li>Carlos
        Dauden</li>\n\
        </ul>\n</li>\n<li>Saran Lim. &lt;<a class=\"reference external\"
        href=\"mailto:saranl&#64;ecosoft.co.th\"\
        >saranl&#64;ecosoft.co.th</a>&gt;</li>\n</ul>\n</div>\n<div class=\"section\"\
        \ id=\"other-credits\">\n<h2><a class=\"toc-backref\" href=\"#toc-entry-7\"\
        >Other credits</a></h2>\n<ul class=\"simple\">\n<li>Odoo Community Association:\
        \ <a class=\"reference external\"
        href=\"https://github.com/OCA/maintainer-tools/blob/master/template/module/static/description/icon.svg\"\
        >Icon</a>.</li>\n</ul>\n</div>\n<div class=\"section\" id=\"maintainers\"\
        >\n<h2><a class=\"toc-backref\" href=\"#toc-entry-8\">Maintainers</a></h2>\n\
        <p>This module is maintained by the OCA.</p>\n<a class=\"reference external\
        \ image-reference\" href=\"https://odoo-community.org\"><img alt=\"Odoo
        Community\
        \ Association\" src=\"https://odoo-community.org/logo.png\" /></a>\n<p>OCA,\
        \ or the Odoo Community Association, is a nonprofit organization whose\nmission\
        \ is to support the collaborative development of Odoo features and\npromote\
        \ its widespread use.</p>\n<p>This module is part of the <a class=\"reference\
        \ external\"
        href=\"https://github.com/OCA/account-analytic/tree/14.0/analytic_tag_dimension\"\
        >OCA/account-analytic</a> project on GitHub.</p>\n<p>You are welcome to
        contribute.\
        \ To learn how please visit <a class=\"reference external\"
