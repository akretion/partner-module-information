        href=\"mailto:david.beal&#64;akretion.com\"\
        >david.beal&#64;akretion.com</a>&gt;</li>\n<li>Mourad EL HADJ MIMOUNE &lt;<a\
        \ class=\"reference external\"
        href=\"mailto:mourad.elhadj.mimoune&#64;akretion.com\"\
