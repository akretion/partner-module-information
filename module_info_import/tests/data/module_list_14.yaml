        id=\"toc-entry-4\">Authors</a></li>\n\
        <li><a class=\"reference internal\" href=\"#contributors\" id=\"toc-entry-5\"\
        >Contributors</a></li>\n<li><a class=\"reference internal\"
        href=\"#maintainers\"\
        \ id=\"toc-entry-6\">Maintainers</a></li>\n</ul>\n</li>\n</ul>\n</div>\n<div\
        \ class=\"section\" id=\"usage\">\n<h1><a class=\"toc-backref\"
        href=\"#toc-entry-1\"\
        >Usage</a></h1>\n<p>Create an inventory, click the compute price button,
        observe\
        \ the new columns displaying the guessed price and source for that guessed\
        \ price.</p>\n</div>\n<div class=\"section\" id=\"bug-tracker\">\n<h1><a
        class=\"\
        toc-backref\" href=\"#toc-entry-2\">Bug Tracker</a></h1>\n<p>Bugs are tracked\
        \ on <a class=\"reference external\"
        href=\"https://github.com/akretion/ak-odoo-incubator/issues\"\
        >GitHub Issues</a>.\nIn case of trouble, please check there if your issue\
        \ has already been reported.\nIf you spotted it first, help us to smash it\
        \ by providing a detailed and welcomed\n<a class=\"reference external\" href=\"\
        https://github.com/akretion/ak-odoo-incubator/issues/new?body=module:%20stock_inventory_simple_valuation%0Aversion:%2014.0%0A%0A**Steps%20to%20reproduce**%0A-%20...%0A%0A**Current%20behavior**%0A%0A**Expected%20behavior**\"\
        >feedback</a>.</p>\n<p>Do not contact contributors directly about support\
        \ or help with technical issues.</p>\n</div>\n<div class=\"section\" id=\"\
