        src=\"https://img.shields.io/badge/licence-AGPL--3-blue.png\"\
        \ /></a> <a class=\"reference external image-reference\"
        href=\"https://github.com/akretion/ak-odoo-incubator/tree/14.0/purchase_edi_file\"\
        ><img alt=\"akretion/ak-odoo-incubator\"
        src=\"https://img.shields.io/badge/github-akretion%2Fak--odoo--incubator-lightgray.png?logo=github\"\
        \ /></a></p>\n<p>This module allows to send file to supplier on purchase
        order\u2019\
        s validation.\nThe file may be sent by mail or using a backend storage (aws,\
        \ sftp, \u2026)\nThe file comes from native Odoo exports but other format\
        \ could be implemented</p>\n<p>The format of the file may depend on the product\
        \ and the supplier or on the supplier only\n(meaning we may have multiple\
