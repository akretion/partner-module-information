        >Maintainers</a></li>\n</ul>\n</li>\n</ul>\n</div>\n<div class=\"section\"\
        \ id=\"configuration\">\n<h1><a class=\"toc-backref\" href=\"#toc-entry-1\"\
        >Configuration</a></h1>\n<p>Go to menu Invoicing &gt; Configuration &gt;
        Analytic\
        \ Accounting &gt; Analytic Accounts Dimensions</p>\n<p>Configurations:</p>\n\
        <ul class=\"simple\">\n<li>Required: if checked, user must select the
        dimension,\
        \ otherwise, cannot save.</li>\n<li>By Sequence: if selected, this tag
        dimension\
        \ is selectable only when previous sequences has been selected.</li>\n<li>Ref\
        \ Model: to refer this analytic tags into a model, and also allow to create\
        \ analytic tags by data in model.</li>\n<li>Filtered by fields: if ref model\
        \ is set, you can also filter (domain) selections by its field(s).</li>\n\
