        >OCA/account-analytic</a> project on GitHub.</p>\n<p>You are welcome to
        contribute.\
        \ To learn how please visit <a class=\"reference external\"
        href=\"https://odoo-community.org/page/Contribute\"\
        >https://odoo-community.org/page/Contribute</a>.</p>\n</div>\n</div>\n</div>\n\
